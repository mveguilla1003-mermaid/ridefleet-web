# Every gate that local discipline runs before a commit, enforced on every
# push — GitHub is the only source of truth between machines (a full working
# base was lost once to an unpushed checkout; this workflow is part of the
# answer). The job mirrors the local sequence exactly: typecheck, strict i18n,
# production build, icon-sync gate, then the two Playwright gates against the
# real production server.
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: i18n parity (strict)
        run: npm run check:i18n
        env:
          I18N_STRICT: '1'

      # Cheap and browserless, so it runs before anything Playwright-shaped:
      # catches a meta string edited without regenerating its social card.
      - name: Open Graph cards are current
        run: npm run check:og

      - name: Production build
        run: npm run build

      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Icon sync gate (brandHex must equal --p-700)
        run: npm run build:icons

      - name: Start production server
        run: |
          npm start &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/es > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "server never came up" >&2
          exit 1

      - name: Screenshot sweep (console errors fail here)
        id: shots
        run: npm run verify:shots

      # Visual regression: compare this run's shots against the baseline
      # artifact of the last successful run on main (same runner image, so
      # font rasterisation matches — the reason baselines are not committed).
      # First run, or expired artifacts: no baseline, diff politely skips.
      - name: Download visual baseline (last successful main run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow gates --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name shots-baseline --dir verify/baseline \
              && echo "baseline from run $run_id" \
              || echo "run $run_id has no shots-baseline artifact — skipping"
          else
            echo "no successful main run yet"
          fi

      - name: Visual diff against baseline
        # Intentional restyles land with [visual-baseline] in the commit
        # message; this run's shots then become the next baseline unopposed.
        id: diff
        if: ${{ !contains(github.event.head_commit.message, '[visual-baseline]') }}
        run: npm run verify:diff

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: verify/diffs
          if-no-files-found: ignore

      - name: Accessibility + metadata audit
        run: npm run verify:a11y

      - name: Demo form end-to-end
        run: npm run verify:form

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-shots
          path: verify/shots
          if-no-files-found: ignore

      # Publish whenever the SHOTS are trustworthy — captured cleanly and not
      # opposed by the diff — rather than only when the whole job is green.
      #
      # It used to require success(), and that cascaded: the /valet run was
      # tagged [visual-baseline] so its diff was skipped, then the audit
      # failed for an unrelated reason, so no baseline was published. The
      # next commit touched only a script, yet compared against a baseline
      # from before /valet existed — and /valet had added a footer link to
      # every page, so every shot differed. One failure poisoned the
      # following commit. Visual state and the a11y/form gates are
      # independent, and the artifact should reflect that.
      - name: Publish shots as next baseline
        if: >-
          always() && github.ref == 'refs/heads/main'
          && steps.shots.outcome == 'success'
          && steps.diff.outcome != 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: shots-baseline
          path: verify/shots
          retention-days: 30
